
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #03070b;
    color: #00eaff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.jarvis {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
}

h1 {
    letter-spacing: 10px;
    margin-top: 20px;
}

.circle {
    width: 220px;
    height: 220px;
    margin: auto;
    border-radius: 50%;
    border: 3px solid #00eaff;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 25px #00eaff;
    animation: pulse 2s infinite;
}

.circle span {
    font-size: 90px;
    font-weight: bold;
}

@keyframes pulse {
    50% {
        transform: scale(1.06);
        box-shadow: 0 0 60px #00eaff;
    }
}

#status {
    color: white;
    min-height: 50px;
    margin: 20px;
}

button {
    border: none;
    border-radius: 50%;
    width: 80px;
    height: 80px;
    background: #00a9bd;
    color: white;
    font-size: 32px;
    box-shadow: 0 0 30px #00eaff;
}

button:active {
    transform: scale(.92);
}

.small {
    color: #7bdde7;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="jarvis">

    <div>
        <h1>JARVIS</h1>
        <p class="small">PERSONAL AI ASSISTANT</p>
    </div>

    <div>
        <div class="circle">
            <span>J</span>
        </div>

        <div id="status">
            Namaste! Main JARVIS hoon.<br>
            Mic dabakar command bolo.
        </div>
    </div>

    <div>
        <button onclick="listen()">🎙️</button>
        <p class="small">Tap to speak</p>
    </div>

</div>

<script>

const status = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {
        status.innerText = "🎙️ JARVIS sun raha hai...";
    };

    recognition.onresult = function(event) {

        const command =
            event.results[0][0].transcript.toLowerCase();

        status.innerText = "Tumne kaha: " + command;

        processCommand(command);
    };

    recognition.onerror = function() {
        status.innerText =
            "Voice nahi samajh aayi. Dobara try karo.";
    };

} else {

    status.innerText =
        "Is browser mein voice recognition supported nahi hai.";
}


function listen() {

    if (!recognition) return;

    recognition.start();
}


function speak(text) {

    status.innerText = text;

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "hi-IN";
    speech.rate = 0.9;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}


function processCommand(command) {

    if (
        command.includes("youtube") ||
        command.includes("यूट्यूब")
    ) {

        speak("YouTube खोल रहा हूँ");

        setTimeout(function() {
            window.location.href =
                "https://www.youtube.com";
        }, 1200);

        return;
    }


    if (
        command.includes("google") ||
        command.includes("गूगल")
    ) {

        speak("Google खोल रहा हूँ");

        setTimeout(function() {
            window.location.href =
                "https://www.google.com";
        }, 1200);

        return;
    }


    if (
        command.includes("time") ||
        command.includes("समय") ||
        command.includes("बजे")
    ) {

        const now = new Date();

        const time =
            now.toLocaleTimeString(
                "hi-IN",
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            );

        speak("अभी समय है " + time);

        return;
    }


    if (
        command.includes("hello") ||
        command.includes("hi") ||
        command.includes("नमस्ते")
    ) {

        speak(
            "नमस्ते! मैं JARVIS हूँ। बताइए क्या करना है?"
        );

        return;
    }


    speak(
        "मैंने सुना: " +
        command +
        ". यह command अभी मेरे basic system में नहीं है।"
    );
}

</script>

</body>
  </html>
